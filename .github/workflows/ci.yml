name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run lint
      - name: the API image builds
        run: docker build --platform linux/amd64 -t status-board-api:ci .
      - name: detector tests
        run: pip install pyyaml && python3 -m unittest scripts/test_detect.py
      - name: eval definitions are satisfiable (free, no API)
        run: |
          git fetch --unshallow || true
          evals/validate.sh
